<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 432" width="320" height="432" role="img">
  <title>Linaje verificable con hashes de datos, código y modelo</title>
  <desc>Los hashes del dataset y del código alimentan el entrenamiento, que produce el hash del modelo. Los tres quedan en un mismo registro de linaje auditable, algo que un nombre de archivo no garantiza.</desc>
<style>
text { font-family: "Inter Tight", system-ui, sans-serif; }
.t-label { font-size: 14px; font-weight: 400; }
.t-strong { font-size: 14px; font-weight: 500; }
.t-sub { font-size: 12px; font-weight: 400; }
.t-mono { font-size: 12px; font-weight: 400; font-family: "IBM Plex Mono", ui-monospace, monospace; }
.c-ink { fill: #111010; } .c-muted { fill: #5e5853; }
.c-accent { fill: #7a2905; } .c-secondary { fill: #12415a; } .c-alert { fill: #6b4e12; }
.b-neutral { fill: #f8f5f2; stroke: #ddd4cd; stroke-width: 1; }
.b-accent { fill: #f8e8e1; stroke: #c34109; stroke-width: 1; }
.b-secondary { fill: #e4edf1; stroke: #1f6a8c; stroke-width: 1; }
.b-alert { fill: #f4efe4; stroke: #a6791f; stroke-width: 1; }
.l-neutral { fill: none; stroke: #5e5853; stroke-width: 1; }
.l-accent { fill: none; stroke: #c34109; stroke-width: 1; }
.l-secondary { fill: none; stroke: #1f6a8c; stroke-width: 1; }
.l-alert { fill: none; stroke: #a6791f; stroke-width: 1; }
.l-dashed { stroke-dasharray: 4 3; }
.m-arrow { fill: #5e5853; }
.dark .c-ink { fill: #f3eeea; } .dark .c-muted { fill: #a39c96; }
.dark .c-accent { fill: #f09885; } .dark .c-secondary { fill: #9cc4da; } .dark .c-alert { fill: #e0c27a; }
.dark .b-neutral { fill: #232120; stroke: #4a4542; }
.dark .b-accent { fill: #3a1d10; stroke: #e07a5f; }
.dark .b-secondary { fill: #10283a; stroke: #5b9bbd; }
.dark .b-alert { fill: #33280f; stroke: #c9a24a; }
.dark .l-neutral, .dark .m-arrow { stroke: #a39c96; }
.dark .m-arrow { fill: #a39c96; }
.dark .l-accent { stroke: #e07a5f; } .dark .l-secondary { stroke: #5b9bbd; } .dark .l-alert { stroke: #c9a24a; }
</style>


  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="m-arrow" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <g>
    <rect class="b-accent" x="16" y="16" width="288" height="340" rx="6"/>
    <text class="t-strong c-accent" x="160" y="44" text-anchor="middle" dominant-baseline="central">Registro de linaje auditable</text>
    <text class="t-sub c-accent" x="160" y="64" text-anchor="middle" dominant-baseline="central">Enlaza datos, código y modelo</text>
  </g>

  <g>
    <rect class="b-secondary" x="32" y="92" width="120" height="56" rx="6"/>
    <text class="t-strong c-secondary" x="92" y="112" text-anchor="middle" dominant-baseline="central">Hash del</text>
    <text class="t-strong c-secondary" x="92" y="128" text-anchor="middle" dominant-baseline="central">dataset</text>
  </g>

  <g>
    <rect class="b-secondary" x="168" y="92" width="120" height="56" rx="6"/>
    <text class="t-strong c-secondary" x="228" y="112" text-anchor="middle" dominant-baseline="central">Hash del</text>
    <text class="t-strong c-secondary" x="228" y="128" text-anchor="middle" dominant-baseline="central">código</text>
  </g>

  <g>
    <rect class="b-neutral" x="72" y="188" width="176" height="56" rx="6"/>
    <text class="t-strong c-ink" x="160" y="216" text-anchor="middle" dominant-baseline="central">Entrenamiento</text>
  </g>

  <g>
    <rect class="b-secondary" x="72" y="284" width="176" height="56" rx="6"/>
    <text class="t-strong c-secondary" x="160" y="312" text-anchor="middle" dominant-baseline="central">Hash del modelo</text>
  </g>

  <line class="l-neutral" x1="92" y1="148" x2="92" y2="188" marker-end="url(#arrow)"/>
  <line class="l-neutral" x1="228" y1="148" x2="228" y2="188" marker-end="url(#arrow)"/>
  <line class="l-neutral" x1="160" y1="244" x2="160" y2="284" marker-end="url(#arrow)"/>

  <text class="t-label c-alert" x="160" y="388" text-anchor="middle" dominant-baseline="central">Contraste: dataset_final_v2.csv,</text>
  <text class="t-label c-alert" x="160" y="408" text-anchor="middle" dominant-baseline="central">un nombre que miente</text>
</svg>
