<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
  <title>Verificación de integridad comparando hashes</title>
  <desc>Se recalcula el hash del archivo descargado y se compara con el SHA-256 publicado por el proveedor. Si coinciden, el archivo es íntegro; si difieren, hubo corrupción o alteración.</desc>
<style>
text { font-family: "Inter Tight", system-ui, sans-serif; }
.t-label { font-size: 14px; font-weight: 400; }
.t-strong { font-size: 14px; font-weight: 500; }
.t-sub { font-size: 12px; font-weight: 400; }
.t-mono { font-size: 12px; font-weight: 400; font-family: "IBM Plex Mono", ui-monospace, monospace; }
.c-ink { fill: #111010; } .c-muted { fill: #5e5853; }
.c-accent { fill: #7a2905; } .c-secondary { fill: #12415a; } .c-alert { fill: #6b4e12; }
.b-neutral { fill: #f8f5f2; stroke: #ddd4cd; stroke-width: 1; }
.b-accent { fill: #f8e8e1; stroke: #c34109; stroke-width: 1; }
.b-secondary { fill: #e4edf1; stroke: #1f6a8c; stroke-width: 1; }
.b-alert { fill: #f4efe4; stroke: #a6791f; stroke-width: 1; }
.l-neutral { fill: none; stroke: #5e5853; stroke-width: 1; }
.l-accent { fill: none; stroke: #c34109; stroke-width: 1; }
.l-secondary { fill: none; stroke: #1f6a8c; stroke-width: 1; }
.l-alert { fill: none; stroke: #a6791f; stroke-width: 1; }
.l-dashed { stroke-dasharray: 4 3; }
.m-arrow { fill: #5e5853; }
.dark .c-ink { fill: #f3eeea; } .dark .c-muted { fill: #a39c96; }
.dark .c-accent { fill: #f09885; } .dark .c-secondary { fill: #9cc4da; } .dark .c-alert { fill: #e0c27a; }
.dark .b-neutral { fill: #232120; stroke: #4a4542; }
.dark .b-accent { fill: #3a1d10; stroke: #e07a5f; }
.dark .b-secondary { fill: #10283a; stroke: #5b9bbd; }
.dark .b-alert { fill: #33280f; stroke: #c9a24a; }
.dark .l-neutral, .dark .m-arrow { stroke: #a39c96; }
.dark .m-arrow { fill: #a39c96; }
.dark .l-accent { stroke: #e07a5f; } .dark .l-secondary { stroke: #5b9bbd; } .dark .l-alert { stroke: #c9a24a; }
</style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="m-arrow" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <g>
    <rect class="b-neutral" x="40" y="40" width="260" height="60" rx="6"/>
    <text class="t-strong c-ink" x="170" y="62" text-anchor="middle" dominant-baseline="central">Proveedor publica SHA-256</text>
    <text class="t-sub c-muted" x="170" y="82" text-anchor="middle" dominant-baseline="central">Hash de referencia</text>
  </g>

  <g>
    <rect class="b-neutral" x="380" y="40" width="260" height="60" rx="6"/>
    <text class="t-strong c-ink" x="510" y="62" text-anchor="middle" dominant-baseline="central">Recalcular hash local</text>
    <text class="t-sub c-muted" x="510" y="82" text-anchor="middle" dominant-baseline="central">Del archivo descargado</text>
  </g>

  <g>
    <rect class="b-accent" x="240" y="160" width="200" height="60" rx="6"/>
    <text class="t-strong c-accent" x="340" y="182" text-anchor="middle" dominant-baseline="central">Comparar hashes</text>
    <text class="t-sub c-accent" x="340" y="202" text-anchor="middle" dominant-baseline="central">Igualdad exacta</text>
  </g>

  <g>
    <rect class="b-secondary" x="40" y="280" width="260" height="60" rx="6"/>
    <text class="t-strong c-secondary" x="170" y="302" text-anchor="middle" dominant-baseline="central">Coinciden</text>
    <text class="t-sub c-secondary" x="170" y="322" text-anchor="middle" dominant-baseline="central">Archivo íntegro</text>
  </g>

  <g>
    <rect class="b-alert" x="380" y="280" width="260" height="60" rx="6"/>
    <text class="t-strong c-alert" x="510" y="302" text-anchor="middle" dominant-baseline="central">Difieren</text>
    <text class="t-sub c-alert" x="510" y="322" text-anchor="middle" dominant-baseline="central">Corrupción o alteración</text>
  </g>

  <path class="l-neutral" d="M170,100 L170,130 L290,130 L290,160" marker-end="url(#arrow)"/>
  <path class="l-neutral" d="M510,100 L510,130 L390,130 L390,160" marker-end="url(#arrow)"/>
  <path class="l-secondary" d="M290,220 L290,250 L170,250 L170,280" marker-end="url(#arrow)"/>
  <path class="l-alert" d="M390,220 L390,250 L510,250 L510,280" marker-end="url(#arrow)"/>

  <text class="t-sub c-muted" x="230" y="240" text-anchor="middle" dominant-baseline="central">Iguales</text>
  <text class="t-sub c-muted" x="450" y="240" text-anchor="middle" dominant-baseline="central">Distintos</text>
</svg>
