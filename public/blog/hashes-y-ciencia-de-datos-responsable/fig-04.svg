<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
  <title>Hash simple frente a HMAC con clave secreta</title>
  <desc>Dos columnas comparan un hash simple de un email, que un atacante revierte hasheando todos los valores posibles, con un HMAC con clave secreta, que no puede reconstruirse sin la clave. En ambos casos los datos siguen siendo personales.</desc>
<style>
text { font-family: "Inter Tight", system-ui, sans-serif; }
.t-label { font-size: 14px; font-weight: 400; }
.t-strong { font-size: 14px; font-weight: 500; }
.t-sub { font-size: 12px; font-weight: 400; }
.t-mono { font-size: 12px; font-weight: 400; font-family: "IBM Plex Mono", ui-monospace, monospace; }
.c-ink { fill: #111010; } .c-muted { fill: #5e5853; }
.c-accent { fill: #7a2905; } .c-secondary { fill: #12415a; } .c-alert { fill: #6b4e12; }
.b-neutral { fill: #f8f5f2; stroke: #ddd4cd; stroke-width: 1; }
.b-accent { fill: #f8e8e1; stroke: #c34109; stroke-width: 1; }
.b-secondary { fill: #e4edf1; stroke: #1f6a8c; stroke-width: 1; }
.b-alert { fill: #f4efe4; stroke: #a6791f; stroke-width: 1; }
.l-neutral { fill: none; stroke: #5e5853; stroke-width: 1; }
.l-accent { fill: none; stroke: #c34109; stroke-width: 1; }
.l-secondary { fill: none; stroke: #1f6a8c; stroke-width: 1; }
.l-alert { fill: none; stroke: #a6791f; stroke-width: 1; }
.l-dashed { stroke-dasharray: 4 3; }
.m-arrow { fill: #5e5853; }
.dark .c-ink { fill: #f3eeea; } .dark .c-muted { fill: #a39c96; }
.dark .c-accent { fill: #f09885; } .dark .c-secondary { fill: #9cc4da; } .dark .c-alert { fill: #e0c27a; }
.dark .b-neutral { fill: #232120; stroke: #4a4542; }
.dark .b-accent { fill: #3a1d10; stroke: #e07a5f; }
.dark .b-secondary { fill: #10283a; stroke: #5b9bbd; }
.dark .b-alert { fill: #33280f; stroke: #c9a24a; }
.dark .l-neutral, .dark .m-arrow { stroke: #a39c96; }
.dark .m-arrow { fill: #a39c96; }
.dark .l-accent { stroke: #e07a5f; } .dark .l-secondary { stroke: #5b9bbd; } .dark .l-alert { stroke: #c9a24a; }
</style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="m-arrow" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <g>
    <rect class="b-neutral" x="40" y="40" width="280" height="56" rx="6"/>
    <text class="t-strong c-ink" x="180" y="60" text-anchor="middle" dominant-baseline="central">Email → hash simple</text>
    <text class="t-sub c-muted" x="180" y="80" text-anchor="middle" dominant-baseline="central">Sin sal ni clave</text>
  </g>

  <g>
    <rect class="b-secondary" x="360" y="40" width="280" height="56" rx="6"/>
    <text class="t-strong c-secondary" x="500" y="60" text-anchor="middle" dominant-baseline="central">Email + clave secreta (HMAC)</text>
    <text class="t-sub c-secondary" x="500" y="80" text-anchor="middle" dominant-baseline="central">Clave guardada aparte</text>
  </g>

  <path class="l-alert" d="M180,96 L180,216" marker-end="url(#arrow)"/>
  <text class="t-sub c-muted" x="196" y="148" dominant-baseline="central">Atacante hashea todos</text>
  <text class="t-sub c-muted" x="196" y="166" dominant-baseline="central">los valores posibles</text>

  <path class="l-secondary l-dashed" d="M500,96 L500,216" marker-end="url(#arrow)"/>
  <text class="t-sub c-muted" x="516" y="148" dominant-baseline="central">Atacante sin</text>
  <text class="t-sub c-muted" x="516" y="166" dominant-baseline="central">la clave</text>

  <g>
    <rect class="b-alert" x="40" y="216" width="280" height="56" rx="6"/>
    <text class="t-strong c-alert" x="180" y="236" text-anchor="middle" dominant-baseline="central">Tabla invertida</text>
    <text class="t-sub c-alert" x="180" y="256" text-anchor="middle" dominant-baseline="central">Email recuperado</text>
  </g>

  <g>
    <rect class="b-secondary" x="360" y="216" width="280" height="56" rx="6"/>
    <text class="t-strong c-secondary" x="500" y="236" text-anchor="middle" dominant-baseline="central">No puede reconstruir la tabla</text>
    <text class="t-sub c-secondary" x="500" y="256" text-anchor="middle" dominant-baseline="central">Falta la clave secreta</text>
  </g>

  <g>
    <rect class="b-accent" x="40" y="304" width="600" height="56" rx="6"/>
    <text class="t-strong c-accent" x="340" y="324" text-anchor="middle" dominant-baseline="central">Seudonimizado, no anónimo</text>
    <text class="t-sub c-accent" x="340" y="344" text-anchor="middle" dominant-baseline="central">Ambos casos siguen siendo datos personales</text>
  </g>
</svg>
