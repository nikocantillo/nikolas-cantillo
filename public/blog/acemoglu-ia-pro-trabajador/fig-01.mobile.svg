<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="320" height="512" role="img">
  <title>Dos rutas para la misma tecnología de IA</title>
  <desc>Desde la misma IA salen dos rutas: imitar al humano lleva a automatización total y trabajadores desplazados; complementarlo lleva a más productividad y tareas nuevas.</desc>
<style>
text { font-family: "Inter Tight", system-ui, sans-serif; }
.t-label { font-size: 14px; font-weight: 400; }
.t-strong { font-size: 14px; font-weight: 500; }
.t-sub { font-size: 12px; font-weight: 400; }
.t-mono { font-size: 12px; font-weight: 400; font-family: "IBM Plex Mono", ui-monospace, monospace; }
.c-ink { fill: #111010; } .c-muted { fill: #5e5853; }
.c-accent { fill: #7a2905; } .c-secondary { fill: #12415a; } .c-alert { fill: #6b4e12; }
.b-neutral { fill: #f8f5f2; stroke: #ddd4cd; stroke-width: 1; }
.b-accent { fill: #f8e8e1; stroke: #c34109; stroke-width: 1; }
.b-secondary { fill: #e4edf1; stroke: #1f6a8c; stroke-width: 1; }
.b-alert { fill: #f4efe4; stroke: #a6791f; stroke-width: 1; }
.l-neutral { fill: none; stroke: #5e5853; stroke-width: 1; }
.l-accent { fill: none; stroke: #c34109; stroke-width: 1; }
.l-secondary { fill: none; stroke: #1f6a8c; stroke-width: 1; }
.l-alert { fill: none; stroke: #a6791f; stroke-width: 1; }
.l-dashed { stroke-dasharray: 4 3; }
.m-arrow { fill: #5e5853; }
.dark .c-ink { fill: #f3eeea; } .dark .c-muted { fill: #a39c96; }
.dark .c-accent { fill: #f09885; } .dark .c-secondary { fill: #9cc4da; } .dark .c-alert { fill: #e0c27a; }
.dark .b-neutral { fill: #232120; stroke: #4a4542; }
.dark .b-accent { fill: #3a1d10; stroke: #e07a5f; }
.dark .b-secondary { fill: #10283a; stroke: #5b9bbd; }
.dark .b-alert { fill: #33280f; stroke: #c9a24a; }
.dark .l-neutral, .dark .m-arrow { stroke: #a39c96; }
.dark .m-arrow { fill: #a39c96; }
.dark .l-accent { stroke: #e07a5f; } .dark .l-secondary { stroke: #5b9bbd; } .dark .l-alert { stroke: #c9a24a; }
</style>


  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="m-arrow" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <g>
    <rect class="b-neutral" x="16" y="16" width="288" height="48" rx="6"/>
    <text class="t-strong c-ink" x="160" y="40" text-anchor="middle" dominant-baseline="central">Misma tecnología de IA</text>
  </g>

  <line class="l-alert" x1="136" y1="64" x2="136" y2="104" marker-end="url(#arrow)"/>
  <path class="l-accent" d="M290,64 L290,348 L256,348" marker-end="url(#arrow)"/>

  <g>
    <rect class="b-alert" x="16" y="104" width="240" height="56" rx="6"/>
    <text class="t-strong c-alert" x="136" y="126" text-anchor="middle" dominant-baseline="central">Ruta 1: imitar al humano</text>
    <text class="t-sub c-alert" x="136" y="146" text-anchor="middle" dominant-baseline="central">Igualar y sustituir</text>
  </g>

  <line class="l-alert" x1="136" y1="160" x2="136" y2="224" marker-end="url(#arrow)"/>
  <text class="t-sub c-muted" x="148" y="185" dominant-baseline="central">Automatización</text>
  <text class="t-sub c-muted" x="148" y="200" dominant-baseline="central">total</text>

  <g>
    <rect class="b-alert" x="16" y="224" width="240" height="56" rx="6"/>
    <text class="t-strong c-alert" x="136" y="246" text-anchor="middle" dominant-baseline="central">Trabajadores desplazados</text>
    <text class="t-sub c-alert" x="136" y="266" text-anchor="middle" dominant-baseline="central">Humano sustituido</text>
  </g>

  <g>
    <rect class="b-accent" x="16" y="320" width="240" height="56" rx="6"/>
    <text class="t-strong c-accent" x="136" y="342" text-anchor="middle" dominant-baseline="central">Ruta 2: complementar</text>
    <text class="t-sub c-accent" x="136" y="362" text-anchor="middle" dominant-baseline="central">IA pro-trabajador</text>
  </g>

  <line class="l-accent" x1="136" y1="376" x2="136" y2="440" marker-end="url(#arrow)"/>
  <text class="t-sub c-muted" x="148" y="408" dominant-baseline="central">Trabajador + IA</text>

  <g>
    <rect class="b-accent" x="16" y="440" width="240" height="56" rx="6"/>
    <text class="t-strong c-accent" x="136" y="462" text-anchor="middle" dominant-baseline="central">Más productividad</text>
    <text class="t-sub c-accent" x="136" y="482" text-anchor="middle" dominant-baseline="central">y tareas nuevas</text>
  </g>
</svg>
