<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" role="img">
  <title>Del avance técnico al estancamiento en el uso</title>
  <desc>Una alta precisión técnica necesita aplicaciones, modelo de negocio y usuarios; aun así, el último tramo de fiabilidad puede frenar el uso cotidiano.</desc>
<style>
text { font-family: "Inter Tight", system-ui, sans-serif; }
.t-label { font-size: 14px; font-weight: 400; }
.t-strong { font-size: 14px; font-weight: 500; }
.t-sub { font-size: 12px; font-weight: 400; }
.t-mono { font-size: 12px; font-weight: 400; font-family: "IBM Plex Mono", ui-monospace, monospace; }
.c-ink { fill: #111010; } .c-muted { fill: #5e5853; }
.c-accent { fill: #7a2905; } .c-secondary { fill: #12415a; } .c-alert { fill: #6b4e12; }
.b-neutral { fill: #f8f5f2; stroke: #ddd4cd; stroke-width: 1; }
.b-accent { fill: #f8e8e1; stroke: #c34109; stroke-width: 1; }
.b-secondary { fill: #e4edf1; stroke: #1f6a8c; stroke-width: 1; }
.b-alert { fill: #f4efe4; stroke: #a6791f; stroke-width: 1; }
.l-neutral { fill: none; stroke: #5e5853; stroke-width: 1; }
.l-accent { fill: none; stroke: #c34109; stroke-width: 1; }
.l-secondary { fill: none; stroke: #1f6a8c; stroke-width: 1; }
.l-alert { fill: none; stroke: #a6791f; stroke-width: 1; }
.l-dashed { stroke-dasharray: 4 3; }
.m-arrow { fill: #5e5853; }
.dark .c-ink { fill: #f3eeea; } .dark .c-muted { fill: #a39c96; }
.dark .c-accent { fill: #f09885; } .dark .c-secondary { fill: #9cc4da; } .dark .c-alert { fill: #e0c27a; }
.dark .b-neutral { fill: #232120; stroke: #4a4542; }
.dark .b-accent { fill: #3a1d10; stroke: #e07a5f; }
.dark .b-secondary { fill: #10283a; stroke: #5b9bbd; }
.dark .b-alert { fill: #33280f; stroke: #c9a24a; }
.dark .l-neutral, .dark .m-arrow { stroke: #a39c96; }
.dark .m-arrow { fill: #a39c96; }
.dark .l-accent { stroke: #e07a5f; } .dark .l-secondary { stroke: #5b9bbd; } .dark .l-alert { stroke: #c9a24a; }
</style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="m-arrow" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <g>
    <rect class="b-neutral" x="160" y="40" width="360" height="56" rx="6"/>
    <text class="t-strong c-ink" x="340" y="61" text-anchor="middle" dominant-baseline="central">Precisión alta</text>
    <text class="t-sub c-muted" x="340" y="79" text-anchor="middle" dominant-baseline="central">Avance técnico</text>
  </g>

  <line class="l-neutral" x1="340" y1="96" x2="340" y2="136" marker-end="url(#arrow)"/>
  <text class="t-sub c-muted" x="356" y="116" dominant-baseline="central">no basta por sí sola</text>

  <g>
    <rect class="b-secondary" x="160" y="136" width="360" height="56" rx="6"/>
    <text class="t-strong c-secondary" x="340" y="157" text-anchor="middle" dominant-baseline="central">Aplicaciones, negocio y usuarios</text>
    <text class="t-sub c-secondary" x="340" y="175" text-anchor="middle" dominant-baseline="central">Lo que el avance necesita</text>
  </g>

  <line class="l-neutral" x1="340" y1="192" x2="340" y2="232" marker-end="url(#arrow)"/>
  <text class="t-sub c-muted" x="356" y="212" dominant-baseline="central">y aun así queda</text>

  <g>
    <rect class="b-alert" x="160" y="232" width="360" height="56" rx="6"/>
    <text class="t-strong c-alert" x="340" y="253" text-anchor="middle" dominant-baseline="central">Último tramo de fiabilidad</text>
    <text class="t-sub c-alert" x="340" y="271" text-anchor="middle" dominant-baseline="central">El más difícil de resolver</text>
  </g>

  <line class="l-neutral" x1="340" y1="288" x2="340" y2="328" marker-end="url(#arrow)"/>
  <text class="t-sub c-muted" x="356" y="308" dominant-baseline="central">si no se resuelve</text>

  <g>
    <rect class="b-accent" x="160" y="328" width="360" height="56" rx="6"/>
    <text class="t-strong c-accent" x="340" y="349" text-anchor="middle" dominant-baseline="central">Estancamiento en el uso cotidiano</text>
    <text class="t-sub c-accent" x="340" y="367" text-anchor="middle" dominant-baseline="central">Dos décadas sin despegar</text>
  </g>
</svg>
